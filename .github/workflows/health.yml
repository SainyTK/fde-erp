name: Health check

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: App is up and key numbers reconcile
        run: |
          curl --fail-with-body --silent --show-error --max-time 30 "${{ vars.PRODUCTION_URL }}/api/health"
